name: backend-tests

# ASR-0B CI preparation. Runs the pytest suite that consolidates the ASR /
# Transcript / SSE contract regressions.
#
# NOTE ON THE LEGACY SUITES: `backend/scripts/test_*.py` are standalone
# historical scripts (Step 5/6/7A/7B/list) predating pytest. They are still the
# authoritative regression record for those steps and are run here as a separate
# job, so a regression in an earlier step is never masked by a green pytest run.
# Gradual migration into `backend/tests/` is the follow-on task; until then BOTH
# must stay green.

on:
  push:
    branches: [main, dafenqi]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (backend/tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-collab.txt
          pip install -r requirements-dev.txt
      - name: Run pytest
        env:
          # The suite sets its own DATABASE_URL / LLM_PROVIDER per test via
          # conftest.py; these are belt-and-braces so nothing accidentally
          # reaches for a real provider or key in CI.
          LLM_PROVIDER: fake
          DEEPSEEK_API_KEY: ""
        run: python -m pytest -q

  legacy-suites:
    name: legacy regression scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-collab.txt
      - name: Run step regression suites
        env:
          LLM_PROVIDER: fake
          DEEPSEEK_API_KEY: ""
        run: |
          for s in test_sse_step5 test_finalize_step6 test_summary_step7a \
                   test_summary_step7b test_list_meetings; do
            echo "=== $s ==="
            python "scripts/$s.py"
          done
